name: Custom lint

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  run-lint:
    name: Run lint
    if: >
      github.event_name != 'pull_request' ||
      github.event.pull_request.head.repo.owner.login == 'chipsalliance'
    runs-on: [ self-hosted, Linux, X64, gcp-custom-runners ]
    container: antmicro/centos-dev-tools
    env:
      GHA_EXTERNAL_DISK: additional-tools-all
      GHA_SA: gh-sa-veer-uploader
    strategy:
      matrix:
        conf_params: [
          # Standard build
          "",
          # DCLS
          "-set lockstep_enable=1 -set lockstep_regfile_enable=1 -set=mubi_width=2 -set=mubi_false=0x1 -set=mubi_true=0x2",
          # TMR
          "-set=triple_modular_redundancy_enable=1 -set=mubi_width=2 -set=mubi_false=0x1 -set=mubi_true=0x2"
          ]
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup conf params
        run: |
          echo "CONF_PARAMS=\"-set build_axi4 -set fpga_optimize=0 ${{ matrix.conf_params }}\"" >> $GITHUB_ENV

      - name: Run lint
        run: _secret_lint:14
