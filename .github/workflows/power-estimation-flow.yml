name: VeeR-EL2 Simulation-based Power Estimation Flow

on:
  workflow_call:

defaults:
  run:
    shell: bash

env:
  DEBIAN_FRONTEND: noninteractive

jobs:
  synthesis-and-power-analysis:
    name: Run EL2 synthesis, simulation, and power analysis
    runs-on: [ self-hosted, Linux, X64, gcp-custom-runners ]
    permissions:
      contents: read
      id-token: write
    container: ghcr.io/antmicro/cores-veer-el2:bazelenv-2026-11-26
    strategy:
      fail-fast: false
      matrix:
        bus:
          - name: AXI
            config: axi4
          - name: AHB
            config: ahb_lite
    env:
      DEBIAN_FRONTEND: "noninteractive"
      GHA_MACHINE_TYPE: n2-standard-16
    steps:
      - name: Setup repository
        uses: actions/checkout@v6
        with:
          path: Cores-VeeR-EL2
          submodules: recursive

      - uses: google-github-actions/auth@v2
        id: gcp-auth
        with:
          service_account: ${{ secrets.GCP_SA }}
          workload_identity_provider: ${{ secrets.WORKLOAD_IDENTITY_PROVIDER }}
          cleanup_credentials: true
          create_credentials_file: true
          export_environment_variables: false

      - name: Bazel setup
        uses: bazel-contrib/setup-bazel@0.19.2
        with:
          bazelisk-version: v1.30.0
          bazelisk-cache: true
          cache-save: true
          external-cache: true
          repository-cache: true
          module-root: "$GITHUB_WORKSPACE/Cores-VeeR-EL2"
          bazelrc: |
            build --incompatible_strict_action_env
            build --google_credentials=${{ steps.gcp-auth.outputs.credentials_file_path }}
            build --remote_cache=https://storage.googleapis.com/gha-runners-bazel-cache-cores-veer-el2
            build --color=yes

      - name: Set repository path
        run: |
          echo "RV_ROOT=$GITHUB_WORKSPACE/Cores-VeeR-EL2" >> "$GITHUB_ENV"
          test -d "$GITHUB_WORKSPACE/Cores-VeeR-EL2"

      - name: Run post-synthesis static power analysis using OpenROAD
        run: |
          bazel build //:veer_el2_${{ matrix.bus.config }}_power_analysis

      - name: Upload power report artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: static_power_analysis_${{ matrix.bus.config }}_report.json
          path: ${{ env.RV_ROOT }}/bazel-bin/veer_el2_${{ matrix.bus.config }}_power_analysis_report.json
          retention-days: 7
          if-no-files-found: warn
